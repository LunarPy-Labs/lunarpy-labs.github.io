<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 44" width="280" height="44" fill="none">
  <!-- Emblem: Circuit Crescent Rocket -->
  <g transform="translate(2, 2)">
    <!-- Ambient Glow -->
    <circle cx="20" cy="20" r="18" fill="#38bdf8" fill-opacity="0.12" filter="blur(4px)"/>
    
    <!-- Upper Crescent Sweep -->
    <path d="M 22 2 C 10 6 3 17 6 28 C 9 34 16 38 23 38 C 14 36 10 27 12 18 C 14 10 20 4 28 3 C 26 2 24 2 22 2 Z" fill="url(#moon-grad-1)"/>

    <!-- Lower Crescent Sweep -->
    <path d="M 38 20 C 37 28 30 36 18 38 C 26 38 35 32 37 23 C 38 22 38 21 38 20 Z" fill="url(#moon-grad-2)"/>

    <!-- Circuit Rocket / Arrow Lines -->
    <!-- Line 1 with node -->
    <path d="M 5 34 L 18 21 L 28 11 L 34 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="27" r="2.5" fill="#07080c" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Main Arrowhead Header -->
    <path d="M 20 22 L 34 8 L 30 8 M 34 8 L 34 12" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 14 26 L 25 15 L 34 6" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

    <!-- Circuit Branch Lines & Dots -->
    <path d="M 20 18 L 22 14 L 26 14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="27" cy="14" r="1.8" fill="#38bdf8"/>

    <path d="M 15 28 L 22 28 L 26 24" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="27" cy="24" r="1.8" fill="#38bdf8"/>
    
    <path d="M 22 31 L 29 24 L 32 24" stroke="#06b6d4" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="32" cy="24" r="1.5" fill="#06b6d4"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="19" letter-spacing="-0.4" fill="#f8fafc">
    LunarPy<tspan fill="#38bdf8">-</tspan><tspan fill="#94a3b8" font-weight="500">Labs</tspan>
  </text>

  <!-- Status Indicator Dot -->
  <circle cx="258" cy="20" r="3" fill="#10b981"/>
  <circle cx="258" cy="20" r="6" fill="#10b981" fill-opacity="0.25"/>

  <defs>
    <linearGradient id="moon-grad-1" x1="4" y1="2" x2="28" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="moon-grad-2" x1="18" y1="20" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
</svg>
